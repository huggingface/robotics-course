<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" width="1180" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="17">
  <title>Closed-loop control of the planar arm: desired trajectory, error, controller, robot, sensors, feedback</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1d22"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d23c3c"/></marker>
  </defs>
  <rect width="1180" height="300" fill="#ffffff"/>
  <!-- desired trajectory -->
  <rect x="20" y="88" width="190" height="84" rx="12" fill="#eef2fb" stroke="#2f6fdb" stroke-width="2"/>
  <text x="115" y="118" text-anchor="middle" font-weight="600" fill="#1b1d22">Desired trajectory</text>
  <text x="115" y="146" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" fill="#2f6fdb">p*(t),  ṗ*(t)</text>
  <!-- sum junction -->
  <line x1="210" y1="130" x2="268" y2="130" stroke="#1b1d22" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="290" cy="130" r="20" fill="#ffffff" stroke="#1b1d22" stroke-width="2"/>
  <text x="290" y="137" text-anchor="middle" font-size="22" fill="#1b1d22">Σ</text>
  <text x="245" y="118" text-anchor="middle" font-size="15" fill="#1b1d22">+</text>
  <text x="304" y="176" text-anchor="middle" font-size="15" fill="#d23c3c">−</text>
  <!-- error label -->
  <line x1="310" y1="130" x2="368" y2="130" stroke="#1b1d22" stroke-width="2" marker-end="url(#ah)"/>
  <text x="339" y="118" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#d23c3c">Δp</text>
  <!-- controller -->
  <rect x="370" y="76" width="290" height="108" rx="12" fill="#fff4ea" stroke="#e0751f" stroke-width="2"/>
  <text x="515" y="106" text-anchor="middle" font-weight="600" fill="#1b1d22">Controller</text>
  <text x="515" y="134" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" fill="#e0751f">q̇ = J(q)⁺ ( ṗ* + k_p Δp )</text>
  <text x="515" y="160" text-anchor="middle" font-size="14" fill="#5f636c">differential IK + proportional feedback</text>
  <!-- robot -->
  <line x1="660" y1="130" x2="718" y2="130" stroke="#1b1d22" stroke-width="2" marker-end="url(#ah)"/>
  <text x="689" y="118" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#1b1d22">q̇</text>
  <rect x="720" y="88" width="180" height="84" rx="12" fill="#f0f3fa" stroke="#1b1d22" stroke-width="2"/>
  <text x="810" y="118" text-anchor="middle" font-weight="600" fill="#1b1d22">Robot</text>
  <text x="810" y="146" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" fill="#1b1d22">joints q(t)</text>
  <!-- sensors -->
  <line x1="900" y1="130" x2="958" y2="130" stroke="#1b1d22" stroke-width="2" marker-end="url(#ah)"/>
  <text x="929" y="118" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#1b1d22">q</text>
  <rect x="960" y="88" width="200" height="84" rx="12" fill="#eaf6f0" stroke="#16925b" stroke-width="2"/>
  <text x="1060" y="118" text-anchor="middle" font-weight="600" fill="#1b1d22">Sensors</text>
  <text x="1060" y="146" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" fill="#16925b">measured p = p(q)</text>
  <!-- feedback path -->
  <path d="M1060,172 L1060,236 L290,236 L290,152" fill="none" stroke="#d23c3c" stroke-width="2" marker-end="url(#ahr)"/>
  <text x="675" y="258" text-anchor="middle" font-size="15" fill="#d23c3c">feedback: the measured hand position is subtracted from the desired one, Δp = p* − p(q)</text>
  <!-- caption -->
  <text x="20" y="40" font-size="15" fill="#5f636c">Closed loop: without the red path (open loop), the controller integrates ṗ* blindly and any modelling error accumulates.</text>
</svg>
